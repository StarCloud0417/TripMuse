name: tripmuse
description: "A new Flutter project."
publish_to: 'none'
version: 0.0.5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core Packages
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.1 # Kept compatible with freezed in dev_deps
  json_annotation: ^4.8.1
  intl: ^0.19.0
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  http: ^1.2.1
  permission_handler: ^12.0.1

  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2

  # Google Sign-In
  google_sign_in: ^7.1.1

  # Mapbox
  mapbox_maps_flutter: ^2.10.0

  # PDF
  pdf: ^3.11.3

  # Google Places
  google_places_flutter: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  
  # Code Generation - versions locked to be compatible with hive_generator
  build_runner: ^2.4.9
  freezed: ^2.4.1
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
